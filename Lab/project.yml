name: GestureLab

# Source of truth for GestureLab.xcodeproj. Regenerate with, from Lab/:
#   xcodegen generate
# The generated project is committed so its shared scheme is stable. Never
# configure signing or capabilities in Xcode's UI; put them here, or the
# team in ../Local.xcconfig, and regenerate.
#
# The app's sources are a synchronized folder: adding, renaming, or deleting
# a file under GestureLab/ needs no regeneration, so a station's files never
# touch the project file.

options:
  bundleIdPrefix: net.alexbrodriguez
  deploymentTarget:
    visionOS: "26.0"
  createIntermediateGroups: false
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

# DEVELOPMENT_TEAM lives in the gitignored Local.xcconfig at the repository's
# root (copy Local.xcconfig.example), which Signing.xcconfig includes if it's
# there. Through the include, the team reaches the build settings without
# xcodegen writing it into the project file, which this public repository
# commits.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_VERSION: "6.0"

packages:
  GestureKit:
    path: ..

targets:
  # The lab: a window listing a station for each gesture, with its trace and
  # tuning, and a mixed immersive space where the chosen station stands.
  GestureLab:
    type: application
    platform: visionOS
    sources:
      - path: GestureLab
        type: syncedFolder
    dependencies:
      - package: GestureKit
        product: GestureKit
    settings:
      base:
        PRODUCT_NAME: GestureLab
        PRODUCT_BUNDLE_IDENTIFIER: net.alexbrodriguez.gesturelab
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: GestureLab
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # One window plus one immersive space needs multiple-scene support.
        UIApplicationSceneManifest:
          UIApplicationPreferredDefaultSceneSessionRole: UIWindowSceneSessionRoleApplication
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        # World tracking, for where the head is, so what a station places
        # stands below the gaze and turns to face the person.
        NSWorldSensingUsageDescription: GestureLab follows where your head is, so what its stations place stands below your gaze and turns to face you.

schemes:
  GestureLab:
    build:
      targets:
        GestureLab: all
    run:
      config: Debug
